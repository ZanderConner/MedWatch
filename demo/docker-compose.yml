name: medsim-range

services:
  router:
    build:
      context: ./range/router
    container_name: medsim-router
    hostname: medsim-router
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      emr_net:
        ipv4_address: 10.20.10.1
      hl7_net:
        ipv4_address: 10.20.20.1
      pacs_net:
        ipv4_address: 10.20.30.1
      lone_linux_net:
        ipv4_address: 10.20.40.1
    volumes:
      - ./captures:/captures
    restart: unless-stopped

  openemr-db:
    image: mariadb:12.3
    container_name: openemr-db
    hostname: openemr-db
    command: ["mariadbd", "--character-set-server=utf8mb4"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MARIADB_AUTO_UPGRADE: "1"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      emr_net:
        ipv4_address: 10.20.10.11
    volumes:
      - openemr-db:/var/lib/mysql
    restart: unless-stopped

  openemr:
    image: openemr/openemr:8.4.1
    container_name: openemr
    hostname: openemr
    cap_add:
      - NET_ADMIN
    environment:
      MYSQL_HOST: openemr-db
      MYSQL_ROOT_PASS: root
      MYSQL_USER: openemr
      MYSQL_PASS: openemr
      OE_USER: admin
      OE_PASS: pass
    depends_on:
      openemr-db:
        condition: service_healthy
      router:
        condition: service_started
    ports:
      - "8080:80"
      - "8444:443"
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "--fail", "--insecure", "--location", "--show-error", "--silent", "https://localhost/meta/health/readyz"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 180s
    networks:
      emr_net:
        ipv4_address: 10.20.10.10
    volumes:
      - openemr-sites:/var/www/localhost/htdocs/openemr/sites
      - openemr-logs:/var/log
    restart: unless-stopped

  openemr-route:
    build:
      context: ./range/host
    container_name: openemr-route
    network_mode: service:openemr
    cap_add:
      - NET_ADMIN
    environment:
      RANGE_GATEWAY: 10.20.10.1
    depends_on:
      openemr:
        condition: service_started
    command: ["/usr/local/bin/route-default.sh"]
    restart: unless-stopped

  mirth-db:
    image: postgres:16
    container_name: mirth-db
    hostname: mirth-db
    environment:
      POSTGRES_USER: mirthdb
      POSTGRES_PASSWORD: mirthdb
      POSTGRES_DB: mirthdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirthdb -d mirthdb"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      hl7_net:
        ipv4_address: 10.20.20.11
    volumes:
      - mirth-db:/var/lib/postgresql/data
    restart: unless-stopped

  mirth:
    image: nextgenhealthcare/connect:4.5.2-jdk
    container_name: mirth
    hostname: mirth
    cap_add:
      - NET_ADMIN
    environment:
      DATABASE: postgres
      DATABASE_URL: jdbc:postgresql://mirth-db:5432/mirthdb
      DATABASE_USERNAME: mirthdb
      DATABASE_PASSWORD: mirthdb
      DATABASE_MAX_CONNECTIONS: 20
      DATABASE_MAX_RETRY: 10
      DATABASE_RETRY_WAIT: 10000
      KEYSTORE_STOREPASS: docker_storepass
      KEYSTORE_KEYPASS: docker_keypass
      VMOPTIONS: -Xmx512m
    depends_on:
      mirth-db:
        condition: service_healthy
      router:
        condition: service_started
    ports:
      - "8081:8080"
      - "8443:8443"
      - "6661:6661"
    networks:
      hl7_net:
        ipv4_address: 10.20.20.10
      lab_net:
        ipv4_address: 10.20.80.12
    volumes:
      - mirth-appdata:/opt/connect/appdata
    restart: unless-stopped

  mirth-route:
    build:
      context: ./range/host
    container_name: mirth-route
    network_mode: service:mirth
    cap_add:
      - NET_ADMIN
    environment:
      RANGE_GATEWAY: 10.20.20.1
    depends_on:
      mirth:
        condition: service_started
    command: ["/usr/local/bin/route-default.sh"]
    restart: unless-stopped

  orthanc:
    image: orthancteam/orthanc:26.9.1-full
    container_name: orthanc
    hostname: orthanc
    cap_add:
      - NET_ADMIN
    environment:
      VERBOSE_ENABLED: "true"
      ORTHANC_JSON: |
        {
          "Name": "MedSim Orthanc",
          "RemoteAccessAllowed": true,
          "AuthenticationEnabled": true,
          "RegisteredUsers": {
            "orthanc": "orthanc"
          },
          "DicomAet": "ORTHANC",
          "DicomPort": 4242,
          "HttpPort": 8042,
          "DicomModalities": {
            "ct-simulator": ["CTSIM", "10.20.70.21", 104],
            "mri-simulator": ["MRISIM", "10.20.70.22", 104]
          }
        }
    depends_on:
      router:
        condition: service_started
    ports:
      - "8042:8042"
      - "4242:4242"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u orthanc:orthanc http://localhost:8042/system >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      pacs_net:
        ipv4_address: 10.20.30.10
      imaging_net:
        ipv4_address: 10.20.70.10
    volumes:
      - orthanc-db:/var/lib/orthanc/db
    restart: unless-stopped

  orthanc-route:
    build:
      context: ./range/host
    container_name: orthanc-route
    network_mode: service:orthanc
    cap_add:
      - NET_ADMIN
    environment:
      RANGE_GATEWAY: 10.20.30.1
    depends_on:
      orthanc:
        condition: service_started
    command: ["/usr/local/bin/route-default.sh"]
    restart: unless-stopped

  # Imaging subnet (imaging_net): two independent DICOM modalities (a CT
  # scanner and an MRI machine) both sending studies to the same Orthanc
  # PACS — models a real radiology department with more than one modality
  # on the wire, not just one, for the distributed-agent demo.
  ct-simulator:
    build:
      context: ./simulators
    container_name: ct-simulator
    hostname: ct-simulator
    environment:
      LAB_ROLE: ct-simulator
      MODALITY: CT
      DEVICE_MODALITY_LABEL: CT
      AET: CTSIM
      TARGET_HOST: 10.20.70.10
      TARGET_PORT: 4242
      TARGET_AET: ORTHANC
      DICOM_LISTEN_PORT: 104
      PATIENT_POOL_CSV: /app/patients.csv
      TCIA_DATA_DIR: /tcia_data/CT
      TCIA_WAIT_MINUTES: 0
      SEND_INTERVAL: 120
      STUDIES_PER_BURST: 1
      WORK_HOURS_START: "00:00"
      WORK_HOURS_END: "00:00"
      TZ: America/New_York
      JITTER_MIN_SECONDS: 5
      JITTER_MAX_SECONDS: 20
      ACCESSION_PREFIX: CT
      HOSPITAL_NAME: MedSim Medical Center
      HOSPITAL_ADDRESS: 100 Simulation Way
    networks:
      imaging_net:
        ipv4_address: 10.20.70.21
    volumes:
      - tcia-dicoms:/tcia_data:ro
      - ./simulators/patients.csv:/app/patients.csv:ro
    restart: unless-stopped

  mri-simulator:
    build:
      context: ./simulators
    container_name: mri-simulator
    hostname: mri-simulator
    environment:
      LAB_ROLE: mri-simulator
      MODALITY: MR
      DEVICE_MODALITY_LABEL: MR
      AET: MRISIM
      TARGET_HOST: 10.20.70.10
      TARGET_PORT: 4242
      TARGET_AET: ORTHANC
      DICOM_LISTEN_PORT: 104
      PATIENT_POOL_CSV: /app/patients.csv
      TCIA_DATA_DIR: /tcia_data/MR
      TCIA_WAIT_MINUTES: 0
      SEND_INTERVAL: 150
      STUDIES_PER_BURST: 1
      WORK_HOURS_START: "00:00"
      WORK_HOURS_END: "00:00"
      TZ: America/New_York
      JITTER_MIN_SECONDS: 5
      JITTER_MAX_SECONDS: 20
      ACCESSION_PREFIX: MR
      HOSPITAL_NAME: MedSim Medical Center
      HOSPITAL_ADDRESS: 100 Simulation Way
    networks:
      imaging_net:
        ipv4_address: 10.20.70.22
    volumes:
      - tcia-dicoms:/tcia_data:ro
      - ./simulators/patients.csv:/app/patients.csv:ro
    restart: unless-stopped

  # Radiology workstation: a normal clinical workstation on imaging_net
  # that generates ordinary background HTTP(S) traffic against Orthanc,
  # Mirth, and OpenEMR — the "someone browsing the PACS/portal" traffic a
  # real radiology floor produces alongside its DICOM device traffic.
  # Multi-homed onto hl7_net/emr_net purely so it can actually reach
  # Mirth's/OpenEMR's web ports (those live on internal bridge networks
  # this box isn't on by default) — not itself meant to look suspicious.
  radiology-workstation:
    build:
      context: ./radiology-workstation
    container_name: radiology-workstation
    hostname: radiology-workstation
    command:
      - python
      - -u
      - traffic_gen.py
      - --orthanc-url
      - http://10.20.70.10:8042
      - --mirth-url
      - https://10.20.20.10:8443
      - --openemr-url
      - https://10.20.10.10
      - --min-interval
      - "15"
      - --max-interval
      - "45"
    networks:
      imaging_net:
        ipv4_address: 10.20.70.30
      hl7_net:
        ipv4_address: 10.20.20.31
      emr_net:
        ipv4_address: 10.20.10.31
    restart: unless-stopped

  # Red-team box: deliberately rogue DICOM/HL7 traffic to trip
  # unrecognized_dicom_initiator / unrecognized_hl7_sender in
  # backend/correlation/rules.js, for demoing policy-violation
  # detection. Kept as its own standalone container/codebase per
  # cyber-range-device-simulation skill guidance (never bundled into
  # the target simulators). Multi-homed on imaging_net (to reach
  # Orthanc's DICOM port) and lab_net (to reach Mirth's HL7 listener).
  # ssh exposed only within these internal networks, for live demo
  # control (see demo/red-team-box/entrypoint.sh) — never published to
  # the host.
  red-team-box:
    build:
      context: ./red-team-box
    container_name: red-team-box
    hostname: red-team-box
    environment:
      DICOM_HOST: "10.20.70.10"
      DICOM_PORT: "4242"
    command:
      - --dicom-host
      - "10.20.70.10"
      - --dicom-port
      - "4242"
      - --dicom-ae
      - ROGUEWS
      - --hl7-host
      - "10.20.80.12"
      - --hl7-port
      - "6661"
      - --hl7-sending-app
      - UNKNOWNLIS
      - --min-interval
      - "30"
      - --max-interval
      - "90"
    networks:
      imaging_net:
        ipv4_address: 10.20.70.31
      lab_net:
        ipv4_address: 10.20.80.31
    restart: unless-stopped

  # Lab subnet (lab_net): the hematology analyzer, sending CBC results
  # to Mirth's lab_net-side interface. Separate subnet from imaging_net
  # so this demo has two genuinely distinct OT/clinical subnets, each
  # observed by its own dedicated monitoring-agent (see
  # monitoring-agent-imaging / monitoring-agent-lab below).
  hl7-simulator:
    build:
      context: ./hematology-sim
    container_name: hl7-simulator
    hostname: hl7-simulator
    command:
      - python
      - -u
      - analyzer.py
      - --listen-host
      - 0.0.0.0
      - --listen-port
      - "6660"
      - --send-host
      - 10.20.80.12
      - --send-port
      - "6661"
      - --min-delay
      - "8"
      - --max-delay
      - "20"
      - --sending-app
      - HEMA-3000
      - --sending-facility
      - HEMATOLOGY
      - --receiving-app
      - MIRTH
      - --receiving-facility
      - MEDSIM
    networks:
      lab_net:
        ipv4_address: 10.20.80.22
    restart: unless-stopped

  # Second lab analyzer, same image/protocol as hl7-simulator above but a
  # distinct AE/sending-app identity ("HEMA-4000") and a much shorter
  # send interval — exists purely to add more baseline HL7 traffic
  # volume to the lab subnet, as if a second bay's analyzer came online.
  # Note: KNOWN_GOOD_HL7_SENDING_APPS in backend/correlation/rules.js
  # already includes "HEMA-4000" so this device won't spuriously trip
  # unrecognized_hl7_sender.
  hl7-simulator-2:
    build:
      context: ./hematology-sim
    container_name: hl7-simulator-2
    hostname: hl7-simulator-2
    command:
      - python
      - -u
      - analyzer.py
      - --listen-host
      - 0.0.0.0
      - --listen-port
      - "6660"
      - --send-host
      - 10.20.80.12
      - --send-port
      - "6661"
      - --min-delay
      - "3"
      - --max-delay
      - "9"
      - --sending-app
      - HEMA-4000
      - --sending-facility
      - HEMATOLOGY
      - --receiving-app
      - MIRTH
      - --receiving-facility
      - MEDSIM
    networks:
      lab_net:
        ipv4_address: 10.20.80.23
    restart: unless-stopped

  hl7-order-generator:
    build:
      context: ./hematology-sim
    container_name: hl7-order-generator
    hostname: hl7-order-generator
    command:
      - python
      - -u
      - order_generator.py
      - --target-host
      - "10.20.20.10"
      - --target-port
      - "6662"
      - --patients-csv
      - /app/patients.csv
      - --min-interval
      - "30"
      - --max-interval
      - "90"
      - --sending-app
      - OE-CPOE
      - --sending-facility
      - MEDSIM
      - --receiving-app
      - LIS
      - --receiving-facility
      - HEMATOLOGY
    depends_on:
      mirth-bootstrap:
        condition: service_completed_successfully
    networks:
      hl7_net:
        ipv4_address: 10.20.20.30
    volumes:
      - ./simulators/patients.csv:/app/patients.csv:ro
    restart: unless-stopped

  # Two dedicated sensors, one per clinical/OT subnet, demonstrating a
  # distributed multi-agent deployment (each subnet has its own
  # observation point, not one sensor trying to see everything from a
  # single vantage point — closer to how a real multi-site hospital
  # network would be instrumented).
  monitoring-agent-imaging:
    build:
      context: ..
      dockerfile: agents/sensor-agent/Dockerfile
    container_name: monitoring-agent-imaging
    hostname: monitoring-agent-imaging
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      LAB_ROLE: monitoring-agent-imaging
      # Compose prefixes network names with the project name ("medsim-range",
      # see the `name:` key at the top of this file) — this must match
      # exactly what `docker network ls` shows for imaging_net.
      TARGET_NETWORK: medsim-range_imaging_net
    # Runs with --network host and taps the imaging_net bridge device
    # directly (resolved at startup by resolve-bridge-and-run.sh via the
    # mounted Docker socket) — the Docker-native SPAN/tap equivalent
    # documented in demo/range/monitoring-agent/TAP-VALIDATION.md. A
    # normal bridge-attached container only sees its own traffic (a
    # Docker bridge is a learning switch, not a hub), so this is
    # required to see real ct-simulator/mri-simulator<->orthanc traffic.
    network_mode: host
    command: ["--config", "/etc/medwatch/sensor-agent-imaging.toml"]
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./range/monitoring-agent/sensor-agent-imaging.toml:/etc/medwatch/sensor-agent-imaging.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  monitoring-agent-lab:
    build:
      context: ..
      dockerfile: agents/sensor-agent/Dockerfile
    container_name: monitoring-agent-lab
    hostname: monitoring-agent-lab
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      LAB_ROLE: monitoring-agent-lab
      TARGET_NETWORK: medsim-range_lab_net
    network_mode: host
    command: ["--config", "/etc/medwatch/sensor-agent-lab.toml"]
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./range/monitoring-agent/sensor-agent-lab.toml:/etc/medwatch/sensor-agent-lab.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: siem
    hostname: siem
    environment:
      PORT: "8080"
      MEDWATCH_API_KEY: change-me
      # Demo range is meant to start EMPTY every time it's spun up — the
      # whole point of the Asset Inventory page is showing the
      # discover -> confirm workflow live, not replaying yesterday's
      # state. ":memory:" means every `docker compose down && up` (or a
      # plain container restart) gets a clean slate; nothing persists to
      # disk. If you ever want a persistent demo instance instead, set
      # this back to a real path and re-add the siem-data volume mount
      # below.
      MEDWATCH_DB_PATH: ":memory:"
    # Real MedWatch backend (backend/), replacing the old placeholder
    # "siem" sleep-infinity container. Kept the container_name/hostname
    # "siem" and the same network/IP/port layout so nothing else in the
    # range (monitoring-agent's backend.url, port mapping, route fixups)
    # needed to change — this container just now runs the real ingest +
    # read API instead of doing nothing.
    depends_on:
      router:
        condition: service_started
    ports:
      - "9000:8080"
    networks:
      lone_linux_net:
        ipv4_address: 10.20.40.10
      agent_siem_net:
        ipv4_address: 10.20.60.10
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        # Browser-side fetches hit the backend on the HOST's published
        # port (9000, see the backend service above), not the internal
        # container port — the browser runs outside the compose network.
        VITE_API_URL: http://localhost:9000
        # Must match the backend service's MEDWATCH_API_KEY below — used
        # only by the Asset Inventory page's write actions (manual add /
        # confirm / delete).
        VITE_ADMIN_API_KEY: change-me
    container_name: frontend
    hostname: frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:80"
    networks:
      lone_linux_net:
        ipv4_address: 10.20.40.11
    restart: unless-stopped

  openemr-seed:
    image: mariadb:12.3
    container_name: openemr-seed
    depends_on:
      openemr:
        condition: service_healthy
    environment:
      MYSQL_PWD: root
    networks:
      emr_net: {}
    volumes:
      - ./openemr/seed:/seed:ro
    command: ["bash", "/seed/seed-openemr.sh"]
    restart: "no"

  mirth-bootstrap:
    image: curlimages/curl:8.10.1
    container_name: mirth-bootstrap
    depends_on:
      mirth:
        condition: service_started
    networks:
      hl7_net: {}
    volumes:
      - ./mirth/bootstrap:/bootstrap:ro
    command: ["/bin/sh", "/bootstrap/bootstrap-mirth.sh"]
    restart: "no"

  openemr-bridge:
    build:
      context: ./openemr-bridge
    container_name: openemr-bridge
    hostname: openemr-bridge
    command:
      - python
      - -u
      - bridge.py
      - --listen-host
      - "0.0.0.0"
      - --listen-port
      - "6661"
      - --db-host
      - openemr-db
      - --db-user
      - openemr
      - --db-password
      - openemr
      - --db-name
      - openemr
    depends_on:
      openemr-db:
        condition: service_healthy
      openemr-seed:
        condition: service_completed_successfully
    networks:
      emr_net:
        ipv4_address: 10.20.10.20
      hl7_net:
        ipv4_address: 10.20.20.40
    restart: unless-stopped

networks:
  emr_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.10.0/24
          gateway: 10.20.10.254
  hl7_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.20.0/24
          gateway: 10.20.20.254
  pacs_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.30.0/24
          gateway: 10.20.30.254
  lone_linux_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.40.0/24
          gateway: 10.20.40.254
  imaging_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.20.70.0/24
          gateway: 10.20.70.254
  lab_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.20.80.0/24
          gateway: 10.20.80.254
  agent_siem_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.20.60.0/24
          gateway: 10.20.60.254

volumes:
  openemr-db:
  openemr-sites:
  openemr-logs:
  mirth-db:
  mirth-appdata:
  orthanc-db:
  tcia-dicoms:
