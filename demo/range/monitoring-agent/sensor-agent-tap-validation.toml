# MedWatch sensor-agent config for the "network tap" validation mode:
# capturing directly on the Docker bridge master device (br-<network id>)
# for orthanc_private_net, via --network host. This is the container-native
# equivalent of a SPAN/mirror port — a Linux bridge forwards learned
# unicast traffic port-to-port and normally would NOT be visible from an
# individual container's own veth (confirmed: 0 events crossed other
# containers when the agent ran attached to the bridge network directly).
# Putting the bridge net device itself into promiscuous mode and capturing
# there sees every frame that crosses the bridge, matching what a real
# SPAN port / network tap would give you on physical switch hardware.

[sensor]
id = "sensor-medsim-range-tap"
site = "medsim-demo-range"

[capture]
# br-<network-id> for orthanc_private_net — find it with:
#   docker network inspect medsim-range_orthanc_private_net --format '{{.Id}}'
# then take the first 12 hex chars: br-<those 12 chars>. Must already be
# promiscuous (ip link set <bridge> promisc on) or this only sees traffic
# actually addressed to the bridge device itself.
interface = "br-ebd816471007"
snaplen = 262144
promiscuous = true
bpf_filter = "not port 22"
asset_flush_interval_secs = 60

[backend]
url = "http://127.0.0.1:9000"
api_key = "change-me"
batch_size = 500
flush_interval_secs = 5
verify_tls = false
