# MedWatch sensor-agent config for the demo range's IMAGING subnet
# monitoring agent (see monitoring-agent-imaging in
# demo/docker-compose.yml) — observes the ct-simulator/mri-simulator
# <-> orthanc DICOM traffic on imaging_net.
#
# `interface` below is a placeholder: the container's entrypoint
# (agents/sensor-agent/resolve-bridge-and-run.sh) resolves imaging_net's
# actual host bridge device name at startup (via the Docker socket) and
# overrides it with --interface, since a compose project's bridge
# device name isn't known ahead of time. See TAP-VALIDATION.md for why
# a normal bridge-attached container can't see this traffic at all —
# a Docker bridge is a learning switch, not a hub.

[sensor]
id = "sensor-imaging"
site = "medsim-demo-range-imaging"

[capture]
interface = "placeholder-overridden-at-runtime"
snaplen = 262144
promiscuous = true
bpf_filter = "not port 22"
asset_flush_interval_secs = 60
# ct-simulator/mri-simulator <-> orthanc runs on port 4242 (see
# demo/docker-compose.yml's orthanc DicomPort), not the IANA-standard
# 104/11112.
dicom_ports = [4242]

[backend]
url = "http://127.0.0.1:9000"
api_key = "change-me"
batch_size = 500
flush_interval_secs = 5
verify_tls = false
