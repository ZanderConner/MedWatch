# Demo-range nginx config: hashed build assets (index-<hash>.js/css)
# are safe to cache aggressively since Vite changes the filename on
# every rebuild, but index.html itself must NEVER be cached — it's the
# only thing referencing the current hash, and this frontend gets
# rebuilt/redeployed constantly during development. Without this, a
# browser that loaded the page once can keep serving a stale
# index.html pointing at a JS bundle that no longer exists (or worse,
# a stale bundle that silently doesn't match the current backend API
# shape), which looks exactly like "the page is broken" even though
# the backend is fine.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
