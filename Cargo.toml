[workspace]
resolver = "2"
members = [
    "agents/sensor-agent",
    "agents/fingerprinting",
    "agents/protocol-parsers/dicom",
    "agents/protocol-parsers/hl7",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["MedWatch"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# release profile tuned for a long-running background agent binary
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
